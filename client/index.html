<!doctype html>
<html lang="en" data-design="premium">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Georgie Flashcards</title>
    <!-- Apply the saved colour theme (light / dark / system; default dark) BEFORE first paint so nothing flashes. -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var pref = localStorage.getItem('georgie.theme');
          var dark = pref === 'dark' || (pref !== 'light' && (pref !== 'system' || window.matchMedia('(prefers-color-scheme: dark)').matches));
          root.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          root.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <style>
      /* Paint the right page colour even before the stylesheet arrives. */
      html { background: #e9f0ff; }
      html[data-theme='dark'] { background: #0a1226; }
    </style>
    <meta name="theme-color" content="#0a1226" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='9' width='14' height='14' rx='3' transform='rotate(45 10 16)' fill='%236C9BFF'/%3E%3Crect x='13' y='9' width='14' height='14' rx='3' transform='rotate(45 20 16)' fill='%239DBAFF' opacity='.9'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
